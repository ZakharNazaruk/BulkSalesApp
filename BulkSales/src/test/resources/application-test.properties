spring.application.name=BulkSales-Test
server.port=0

# H2 Test Database
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# Disable Flyway for tests (we use ddl-auto=create-drop)
spring.flyway.enabled=false

# Logging
logging.level.root=WARN
logging.level.com.example.BulkSales=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.security=DEBUG

# Test API Key
groq.api.key=test-api-key

# Notification Service (will be mocked in tests)
notification.service.url=http://localhost:9999

# Security
spring.security.user.name=test
spring.security.user.password=test
